name: Prepare approved V2 publication for review

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Explicit tag with the four reviewed V2 input assets
        type: string
        required: true
      archive_sha256:
        description: Independently reviewed V2 ZIP SHA-256
        type: string
        required: true
      trusted_approval_sha256:
        description: Independently trusted exact operator approval SHA-256
        type: string
        required: true
      policy_sha256:
        description: Independently reviewed publisher-approved V2 policy SHA-256
        type: string
        required: true
      base_url:
        description: Canonical HTTPS installation directory ending in /v2/
        type: string
        required: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install the locked verifier
        run: |
          python -m pip install uv==0.11.29
          uv sync --locked
      - name: Download the explicitly selected review inputs
        env:
          GH_TOKEN: ${{ github.token }}
          V2_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python -c 'import os,re; assert re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,119}", os.environ["V2_RELEASE_TAG"])'
          gh release download "$V2_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern sugarglider-regions-static.zip \
            --pattern ign-publication-evidence.json \
            --pattern operator-approval.json \
            --pattern privacy-v2.html \
            --dir "$RUNNER_TEMP/v2-inputs"
      - name: Prepare the exact V2 snapshot without publishing
        env:
          V2_ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          V2_APPROVAL_SHA256: ${{ inputs.trusted_approval_sha256 }}
          V2_POLICY_SHA256: ${{ inputs.policy_sha256 }}
          V2_BASE_URL: ${{ inputs.base_url }}
        run: |
          uv run --offline python -m sugarglider_publisher prepare \
            --archive "$RUNNER_TEMP/v2-inputs/sugarglider-regions-static.zip" \
            --archive-sha256 "$V2_ARCHIVE_SHA256" \
            --evidence "$RUNNER_TEMP/v2-inputs/ign-publication-evidence.json" \
            --approval "$RUNNER_TEMP/v2-inputs/operator-approval.json" \
            --trusted-approval-sha256 "$V2_APPROVAL_SHA256" \
            --policy "$RUNNER_TEMP/v2-inputs/privacy-v2.html" \
            --policy-sha256 "$V2_POLICY_SHA256" \
            --base-url "$V2_BASE_URL" \
            --output "$RUNNER_TEMP/v2-publication"
      - name: Upload an ordinary review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prepared-v2-not-published
          path: ${{ runner.temp }}/v2-publication
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
