name: Check V2 publisher with synthetic data

on:
  pull_request:
  push:
    branches: [main, feat/v2-only-publication]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.11.29
      - run: uv sync --locked
      - run: make check
      - name: Separate synthetic loopback HTTPS acceptance
        run: uv run --offline python -m tests.https_acceptance
